name: Loop Engineering PR Review

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to review
        required: true
        type: number
      event_prompt:
        description: Review objective placed at the start of the Goal Prompt
        required: false
        default: Review this change against the repository rules and its requested behavior.
        type: string

jobs:
  review:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the selected repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read trusted PR facts and form the Goal Prompt
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          EVENT_PROMPT: ${{ inputs.event_prompt }}
        run: node .github/loop-engineering/prepare-review.mjs
      - name: Check out the trusted PR target
        env:
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          git checkout --detach "$HEAD_SHA"
      - name: Run the Codex Compatible Executor
        id: codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: pr-review-goal.md
          output-schema-file: .github/loop-engineering/review-result.schema.json
          permission-profile: :read-only
          safety-strategy: read-only
      - name: Map the Action terminal and final-message
        env:
          FINAL_MESSAGE: ${{ steps.codex.outputs.final-message }}
          TRUSTED_TARGET: ${{ steps.target.outputs.target_json }}
        run: node .github/loop-engineering/capture-review.mjs
      - name: Preserve the trusted target and candidate Review Result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-review-result
          path: |
            pr-review-target.json
            pr-review-context.md
            review-result.json
          if-no-files-found: error

  publish:
    needs: review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Check out the trusted publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Download the candidate Review Result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr-review-result
          path: pr-review-artifact
      - name: Validate and publish the Check Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/loop-engineering/publish-review.mjs
